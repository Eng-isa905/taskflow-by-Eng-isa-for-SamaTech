services:
  taskflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow-sama-tech:0.3.0
    container_name: taskflow-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_PATH: ${DB_PATH:-/app/data/taskflow.sqlite}
      SESSION_SECRET: ${SESSION_SECRET:?Generate SESSION_SECRET in .env before starting TaskFlow}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - taskflow_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s

volumes:
  taskflow_data:
    name: taskflow_data
